services:
  postgres:
    image: postgres:17
    container_name: stayfinder-postgres

    environment:
      POSTGRES_USER: stayfinder
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: stayfinder

    ports:
      - "5432:5432"

    volumes:
      - stayfinder_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayfinder -d stayfinder"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stayfinder_data:
